name: TOTK Explorer Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Switch OVL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    container:
      image: devkitpro/devkita64:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fetch dependencies
        run: bash tools/setup_deps.sh

      - name: Show toolchain
        run: |
          set -euxo pipefail
          aarch64-none-elf-g++ --version
          test -d "$DEVKITPRO/libnx"
          test -d "$DEVKITPRO/devkitA64"
          echo "Using preinstalled libnx: $DEVKITPRO/libnx"

      - name: Verify repository
        run: |
          set -euxo pipefail
          python3 tools/verify_repo.py
          test -f data/points.csv
          test -s libs/libdmntcht.a
          test -s libs/libtesla/include/tesla.hpp
          test -s include/switch/dmntcht.h

      - name: Build
        run: |
          set -euxo pipefail
          make verify-layout
          make clean
          make -j2
          test -s TOTK-Explorer-v3.ovl
          ls -lh TOTK-Explorer-v3.ovl

      - name: Prepare SD package
        run: |
          set -euxo pipefail
          test -s TOTK-Explorer-v3.ovl
          test -f data/points.csv
          rm -rf artifact
          mkdir -p artifact/sd/switch/.overlays
          mkdir -p artifact/sd/switch/totk_explorer
          cp TOTK-Explorer-v3.ovl artifact/sd/switch/.overlays/
          cp data/points.csv artifact/sd/switch/totk_explorer/
          cp INSTALL_SD.txt artifact/
          cp README_RU.md artifact/
          test -s artifact/sd/switch/.overlays/TOTK-Explorer-v3.ovl
          test -f artifact/sd/switch/totk_explorer/points.csv
          find artifact -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-Explorer-v3
          path: artifact/
          include-hidden-files: true
          if-no-files-found: error
